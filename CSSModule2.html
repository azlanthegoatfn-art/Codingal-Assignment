<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width">
  <title>My Color Card</title>
</head>


  <Style>

    /*Universal Selector - applies to everything on the page*/
    * {
      font-size: 16px;
    }

    /*Element Selector*/
    Body{
      background-color: lightgray;
    }

    h1 {
      color: darkblue;
    }

    h2 {
      color: purple;
    }
    p {
      color:dimgray;
    }

    /*class selector*/
    .my-detail {
      color: darkgreen;
      font-weight: bold;
    }

    /*ID selector*/
    #my-card {
      background-color: lightcyan;
    }
  </Style>

    <div id="my-card">

      <p class="my-detail">My favourite food is Biryani</p>

       </div>
