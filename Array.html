<html>
    <body>
        <p Id="myjoin"</p>
        <script>
            var fruits = ["Apple", "Banana", "Mango"];

fruits.push("Orange");       // Adds at the end
console.log
console.log(fruits.includes("Orange"));
fruits.pop("Apple");                // Removes the last element
console.log
console.log(fruits.includes("Apple"));
fruits.unshift("Grapes");    // Adds at the beginning
console.log
console.log(fruits.includes("Grapes"));
fruits.shift("Mango");              // Removes the first element
console.log
console.log(fruits.includes("Mango"));
fruits.reverse();            // Reverses the array
document.getElementById("myjoin").innerHTML = fruits.join(" ");


        </script>
    </body>
</html>
